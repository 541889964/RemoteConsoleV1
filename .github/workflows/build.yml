name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -e
          if [ ! -d "$ANDROID_HOME" ]; then
            mkdir -p "$HOME/android-sdk"
            echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
            export ANDROID_HOME="$HOME/android-sdk"
          fi
          echo "SDK: $ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            cd /tmp
            rm -rf cmdline-tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O ct.zip
            unzip -q ct.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Install SDK Components
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-27" "build-tools;27.0.3"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Master
        run: gradle :master:assembleRelease --no-daemon
      - name: Build Slave
        run: gradle :slave:assembleRelease --no-daemon

      - name: Prepare Outputs
        run: |
          mkdir -p outputs
          find master -name "*.apk" -path "*release*" -exec cp {} outputs/master-V1.apk \;
          find slave  -name "*.apk" -path "*release*" -exec cp {} outputs/slave-V1.apk \;
          ls -lh outputs/

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteConsoleV1
          path: outputs/*.apk

      - uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          name: "V1 Build #${{ github.run_number }}"
          files: outputs/*.apk
